name = "socrata-agent"
main = "worker/index.js"
compatibility_date = "2026-09-01"

rules = [{ type = "Text", globs = ["**/*.html"], fallthrough = true }]

[vars]
MODEL = "openai/gpt-5.6-luna"
CITIES = "norfolk,seattle,chicago"
PER_IP_DAILY = "20"
DAILY_BUDGET_USD = "2"
MAX_STEPS = "6"
MAX_TOKENS = "1200"

# Limits are counted here. Create it once and paste the id:
#   npx wrangler kv namespace create LIMITS
# Without this binding the Worker refuses questions (it fails closed). For
# local `wrangler dev` only, put ALLOW_UNLIMITED=true in .dev.vars.
# [[kv_namespaces]]
# binding = "LIMITS"
# id = "<paste id>"

# Optional: put Cloudflare Access in front and count limits per person.
# Set both, and the Worker refuses any request without a valid Access token:
# ACCESS_TEAM_DOMAIN = "yourteam.cloudflareaccess.com"
# ACCESS_AUD = "<application audience tag from the Access dashboard>"
# PER_USER_DAILY = "40"

# Secrets (never in this file):
#   npx wrangler secret put OPENROUTER_API_KEY
#   npx wrangler secret put IP_SALT            # any random string
#   npx wrangler secret put SOCRATA_APP_TOKEN  # optional

# Siren: the public deployment at jason-edelman.org/ask-siren.
# Deploys: Workers Builds (the Cloudflare dashboard's Git connection on the
# "siren" Worker) runs `npm ci && npm test`, then `npx wrangler deploy --env
# siren`, on every push to main. Preview builds are off: a preview would share
# this Worker's secrets and KV on a public workers.dev URL.
# A route runs before the site's Custom Domain, so only this path reaches this
# Worker; the rest of jason-edelman.org is untouched.
#   npx wrangler kv namespace create LIMITS --env siren   # paste the id below
#   npx wrangler secret put OPENROUTER_API_KEY --env siren
#   npx wrangler secret put IP_SALT --env siren
#   npx wrangler secret put INVITE_SECRET --env siren   # any long random string
#   npx wrangler secret put ANTHROPIC_API_KEY --env siren   # if MODEL is a claude-* id
#   npx wrangler secret put RESEND_API_KEY --env siren   # email sign-in (resend.com)
#   npx wrangler secret put ADMIN_EMAILS --env siren     # steward emails for <base>/admin, comma-separated
# Email sign-in also needs LOGIN_FROM below, an address on a domain verified
# in Resend. Until both are set, the page offers invite codes only.
#   npx wrangler deploy --env siren
# Pre-alpha: invite-only, with a waitlist. Make codes with
#   node scripts/invites.js create --label "who it's for" --uses 5
# and export the waitlist with `node scripts/invites.js waitlist > ~/siren-waitlist.csv`
# (keep it out of this public repository).
[env.siren]
name = "siren"
account_id = "543fde7feabd0af945bfae926ceea7ad"
routes = [
  { pattern = "jason-edelman.org/ask-siren", zone_name = "jason-edelman.org" },
  { pattern = "jason-edelman.org/ask-siren/*", zone_name = "jason-edelman.org" },
]

[env.siren.vars]
DEPLOYMENT = "siren"
BASE_PATH = "/ask-siren"
MODEL = "claude-sonnet-5-5"
PER_IP_DAILY = "20"
DAILY_BUDGET_USD = "2"
MAX_STEPS = "6"
MAX_TOKENS = "1200"
INVITE_REQUIRED = "true"
PER_INVITE_DAILY = "30"
PER_USER_DAILY = "30"
CONVERSATION_DAYS = "7"
LOGIN_FROM = "Siren <siren@send.jason-edelman.org>"   # verified in Resend (Jason, 2026-11-04)
# Bluesky sign-in and endorsements on the public request list
# (docs/bluesky-endorsements.md). Two steps:
#   1. This file sets PUBLIC_ORIGIN and the rate-limit bindings below, with
#      BLUESKY_LOGIN unset: the OAuth client metadata goes live at
#      https://jason-edelman.org/ask-siren/oauth-client-metadata.json (the
#      client_id), and everything else stays off. Probe it with
#      `node scripts/bsky-probe.js --account <a real handle>`.
#   2. A one-line PR adds BLUESKY_LOGIN = "true" here (a dashboard-only var
#      is overwritten by the next deploy).
# No new secret: INVITE_SECRET and IP_SALT, already set, are reused with
# domain separation. Optional knobs, with their defaults:
#   ENDORSE_PUBLIC = "established"   ENDORSE_YOUNG_DAYS = "30"
#   ENDORSE_MIN_ACCOUNT_DAYS = "0"    ENDORSE_RETENTION_MONTHS = "12"
#   ENDORSE_PER_DID_DAILY = "30"      ENDORSE_PER_VISITOR_DAILY = "200"
#   ENDORSE_PER_ISSUER_DAILY = "20"   ENDORSE_PER_DOMAIN_DAILY = "60"
#   ENDORSE_OPEN_ISSUERS = "https://bsky.social"
#   BSKY_LOGIN_PER_VISITOR_HOURLY = "60"
#   DOH_URL = "https://cloudflare-dns.com/dns-query"   PLC_URL = "https://plc.directory"
PUBLIC_ORIGIN = "https://jason-edelman.org"

[[env.siren.kv_namespaces]]
binding = "LIMITS"
id = "d4dfe5ca9b814268a1a1abe052287959"

# Bluesky sign-in and endorsements: burst limits and circuit breakers.
# Counts are per Cloudflare location and approximate (Workers Rate Limiting);
# the period is 10 or 60 seconds; namespace_id is an integer unique on the
# account. Bindings aren't inherited, so they live under env.siren.
[[env.siren.ratelimits]]
name = "BSKY_VISITOR_RL"      # per hashed visitor: login starts, callbacks, endorse/unendorse bursts
namespace_id = "2611061"
simple = { limit = 60, period = 60 }

[[env.siren.ratelimits]]
name = "BSKY_INPUT_RL"        # per account typed into the login form; per-server endorse bursts
namespace_id = "2611062"
simple = { limit = 3, period = 60 }

[[env.siren.ratelimits]]
name = "BSKY_ACCOUNT_RL"      # per signed-in account: me, endorse, unendorse, forget
namespace_id = "2611063"
simple = { limit = 30, period = 60 }

[[env.siren.ratelimits]]
name = "BSKY_SITE_RL"         # site-wide circuit breakers: login, callback, endorse
namespace_id = "2611064"
simple = { limit = 300, period = 60 }
