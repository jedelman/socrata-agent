name = "socrata-agent"
main = "worker/index.js"
compatibility_date = "2026-09-01"

rules = [{ type = "Text", globs = ["**/*.html"], fallthrough = true }]

[vars]
MODEL = "openai/gpt-5.6-luna"
CITIES = "norfolk,seattle,chicago"
PER_IP_DAILY = "20"
DAILY_BUDGET_USD = "2"
MAX_STEPS = "6"
MAX_TOKENS = "1200"
# SUBREQUEST_BUDGET: outbound requests per answer, model calls and retries
# included (default 120, range 10-10000): a guard against a runaway answer.
# Siren's account is on Workers Paid (10,000 external subrequests per
# invocation, since 2026-11-09); on Workers Free (50) set it to 45. Tool
# requests stop short of the budget so the final answer can still be asked
# for. See src/request-budget.js.
# SUBREQUEST_BUDGET = "120"
# WORKING_NOTES: the chat page's live working notes (default on): the model's
# summarized thinking (Claude models) and a line per tool, streamed while the
# answer is worked out, never saved. "off" sends only the JSON answer. See
# worker/ask-stream.js and the README's Deploy section.
# WORKING_NOTES = "off"

# Limits are counted here. Create it once and paste the id:
#   npx wrangler kv namespace create LIMITS
# Without this binding the Worker refuses questions (it fails closed). For
# local `wrangler dev` only, put ALLOW_UNLIMITED=true in .dev.vars.
# [[kv_namespaces]]
# binding = "LIMITS"
# id = "<paste id>"

# Optional: put Cloudflare Access in front and count limits per person.
# Set both, and the Worker refuses any request without a valid Access token:
# ACCESS_TEAM_DOMAIN = "yourteam.cloudflareaccess.com"
# ACCESS_AUD = "<application audience tag from the Access dashboard>"
# PER_USER_DAILY = "40"

# Secrets (never in this file):
#   npx wrangler secret put OPENROUTER_API_KEY
#   npx wrangler secret put IP_SALT            # any random string
#   npx wrangler secret put SOCRATA_APP_TOKEN  # optional

# Siren: the public deployment at https://ask-siren.jason-edelman.org/ (its
# own origin since 2026-11-10; before that, jason-edelman.org/ask-siren).
# Deploys: Workers Builds (the Cloudflare dashboard's Git connection on the
# "siren" Worker) runs `npm ci && npm test`, then `npx wrangler deploy --env
# siren`, on every push to main. Preview builds are off: a preview would share
# this Worker's secrets and KV on a public workers.dev URL.
#   npx wrangler kv namespace create LIMITS --env siren   # paste the id below
#   npx wrangler secret put OPENROUTER_API_KEY --env siren
#   npx wrangler secret put IP_SALT --env siren
#   npx wrangler secret put INVITE_SECRET --env siren   # any long random string
#   npx wrangler secret put ANTHROPIC_API_KEY --env siren   # if MODEL is a claude-* id
#   npx wrangler secret put RESEND_API_KEY --env siren   # email sign-in (resend.com)
#   npx wrangler secret put ADMIN_EMAILS --env siren     # steward emails for <base>/admin, comma-separated
# Email sign-in also needs LOGIN_FROM below, an address on a domain verified
# in Resend. Until both are set, the page offers invite codes only.
#   npx wrangler deploy --env siren
# Pre-alpha: invite-only, with a waitlist. Make codes with
#   node scripts/invites.js create --label "who it's for" --uses 5
# and export the waitlist with `node scripts/invites.js waitlist > ~/siren-waitlist.csv`
# (keep it out of this public repository).
[env.siren]
name = "siren"
account_id = "543fde7feabd0af945bfae926ceea7ad"
# The Custom Domain: the Worker is the origin for the whole hostname, and
# deploying creates its DNS record and certificate (the zone is in this
# account; "You cannot create a Custom Domain on a hostname with an existing
# CNAME DNS record", and ask-siren had no public record on 2026-11-10).
# Adding a Custom Domain or route needs Workers Routes edit on the zone
# (developers.cloudflare.com/workers/authorization/workers/), which the token
# Workers Builds creates by default has, for every zone in the account.
# https://developers.cloudflare.com/workers/configuration/routing/custom-domains/
# (last updated 2026-09-29, read 2026-11-10).
# The old routes stay, so the old address keeps answering, with redirects
# only (MOVED_FROM below, worker/moved.js). Routes run before the root
# site's Custom Domain on jason-edelman.org: "Routes can fetch() Custom
# Domains and take precedence if configured on the same hostname"
# (https://developers.cloudflare.com/workers/configuration/routing/routes/,
# last updated 2026-10-18, read 2026-11-10). So only /ask-siren and
# /ask-siren/* reach this Worker there; the rest of jason-edelman.org is
# untouched. With routes set, workers_dev is inferred false.
routes = [
  { pattern = "ask-siren.jason-edelman.org", custom_domain = true },
  { pattern = "jason-edelman.org/ask-siren", zone_name = "jason-edelman.org" },
  { pattern = "jason-edelman.org/ask-siren/*", zone_name = "jason-edelman.org" },
]
# The move ran in two deploys (Jason, 2026-11-10): #26 attached the Custom
# Domain alone, confirmed live (200, certificate for the new name), before
# this file turned the old path into redirects. Wrangler publishes the
# script before routes and domains, so doing both at once would have
# redirected to a host that might not answer yet.

# The free tier's sweep (docs/free-tier.md, "Withdrawing, and the steward"):
# every ten minutes, worker/index.js scheduled re-checks at most 40 public
# questions not checked for an hour, and withdraws one whose record is gone
# from the asker's own PDS; it also clears abandoned claims. With PUBLIC_ASK
# unset it returns at once: no D1 call, no fetch. (The old endorsement purge
# cron, retired with the server-side design, is not this.)
[env.siren.triggers]
crons = ["*/10 * * * *"]

# The free tier's instant takedowns (docs/free-tier.md, "Deletions as they
# happen"): one QuestionWatcher Durable Object (worker/question-watcher.js,
# exported from worker/index.js) holds a WebSocket to Jetstream and takes a
# public question down as soon as its record is deleted in the asker's own
# account, after the asker's PDS confirms it. The cron above pings it, only
# with PUBLIC_ASK on and ready; with the flag off nothing ever reaches it, so
# this first deploy only creates the empty namespace.
# THIS DEPLOY IS A ROLLBACK BARRIER: Cloudflare refuses a rollback across "a
# Durable Object class lifecycle change (via exports or the legacy
# migrations array)" (developers.cloudflare.com/workers/versions-and-
# deployments/rollbacks/, "Bindings", read 2026-11-10). Once it is live, no
# Siren version from before it can be rolled back to; fix forward. It ships
# as its own deploy ("Durable Object lifecycle changes should be deployed
# independently of other code changes", /workers/versions-and-deployments/
# gradual-deployments/with-durable-objects/).
# A SQLite-backed class (new_sqlite_classes: "New Durable Object namespaces
# must use the SQLite storage backend", developers.cloudflare.com/changelog/
# post/2026-07-09-restrict-new-kv-backed-namespaces/), declared with the
# migrations array, which Cloudflare now calls the legacy form beside
# `exports`. Chosen because only the configuration form can move one way
# later (to `exports`; "After a Worker deploys with exports, it cannot return
# to the migrations array", /durable-objects/reference/durable-objects-
# migrations/, last updated 2026-09-28, read 2026-11-10): neither form makes
# the deploy itself reversible. Bindings aren't inherited, so both live
# under env.siren. Never rename the class or change this tag: a later change
# is a new migration with a new tag. JETSTREAM_URL (vars) replaces the
# default instances, the two public Jetstream v2 ones.
[[env.siren.durable_objects.bindings]]
name = "QUESTION_WATCHER"
class_name = "QuestionWatcher"

[[env.siren.migrations]]
tag = "v1-question-watcher"
new_sqlite_classes = ["QuestionWatcher"]

[env.siren.vars]
DEPLOYMENT = "siren"
# Served at the root of its own origin: no path prefix.
BASE_PATH = ""
# The old address: every request to it, over http or https, answers 301 (GET,
# HEAD) or 308 (other methods) to the same path and query here, minus
# /ask-siren. Email sign-ins there end (their cookie was jason-edelman.org's);
# an invite held as a cookie there is carried over (worker/moved.js).
MOVED_FROM = "https://jason-edelman.org/ask-siren"
MODEL = "claude-sonnet-5-5"
PER_IP_DAILY = "20"
DAILY_BUDGET_USD = "2"
MAX_STEPS = "6"
MAX_TOKENS = "1200"
# SUBREQUEST_BUDGET defaults to 120: Siren's account is on Workers Paid
# (2026-11-09). Set it to 45 if the account ever returns to Free (50 a request).
# Working notes are on (the default): uncomment to turn them off.
# WORKING_NOTES = "off"
# Web search runs where the deployment sets webSearch (Siren does:
# deployments/siren.config.js). The Anthropic organization must allow web
# search in the Console; if it doesn't, every request that declares the tool
# is refused (a 400) and every answer fails. Jason confirmed it allowed, with
# no domain restrictions, on 2026-11-10. Uncomment to turn it off at once.
# WEB_SEARCH = "off"
INVITE_REQUIRED = "true"
PER_INVITE_DAILY = "30"
PER_USER_DAILY = "30"
# Conversations are kept until the account deletes them (Jason, 2026-11-10):
# no CONVERSATION_DAYS. Set it to a number of days (1 to 365) to expire them.
LOGIN_FROM = "Siren <siren@send.jason-edelman.org>"   # verified in Resend (Jason, 2026-11-04)
# Bluesky endorsements (docs/bluesky-endorsements.md, which has the rollout,
# the optional knobs and the reasons): records in each endorser's own repo,
# written from the browser and counted through Constellation. Off until a PR
# adds BLUESKY_LOGIN = "true" here, after the rollout's live probe.
# CONSTELLATION_URL (default https://constellation.microcosm.blue) switches to
# a self-hosted instance; APPVIEW_URL (default https://public.api.bsky.app)
# to another AppView.
# The free tier (docs/free-tier.md): ask in public with Bluesky and an
# invite, every question and answer public on this site, in SIREN_DB. Off
# until a PR adds PUBLIC_ASK = "true" here, after migration 0004 is applied
# and a live sign-in, ask, follow-up, withdraw and steward hide are tried.
# It needs BLUESKY_LOGIN on, SIREN_DB and invite mode; with any missing, its
# routes answer 503.
# JETSTREAM_URL: the Jetstream instances the takedown watcher uses, in order
# (comma-separated wss:// origins; default below, Jetstream v2's public pair).
# An entry of any other shape turns the watcher off (logged); the sweep runs.
# JETSTREAM_URL = "wss://jetstream.us-east.bsky.network,wss://jetstream.us-west.bsky.network"
# Research memory (docs/research-memory.md; Jason, 2026-11-11): the
# prior_research tool gives an answer where earlier research looked, never
# what it concluded. Every scope is opt-in. A signed-in account's own
# conversations need PRIOR_RESEARCH = "true"; public answers come with
# PUBLIC_ASK; sources people share from their answers ("Share these
# sources") need SHARED_RESEARCH = "true", added by a PR after migration
# 0005 is applied. PRIOR_RESEARCH = "off" turns the tool off everywhere.
# Both on for Siren (Jason, 2026-11-11, "Yep"; migration 0005 applied the
# same day).
PRIOR_RESEARCH = "true"
SHARED_RESEARCH = "true"
# Siren's origin. Sign-in links, annotation ids, the Bluesky client_id and
# every endorsement subject URL are built from it. Subjects are fixed from
# here on: changing it after endorsements exist strands them
# (docs/bluesky-endorsements.md, "The record").
PUBLIC_ORIGIN = "https://ask-siren.jason-edelman.org"
# Telemetry (worker/telemetry.js; Jason, 2026-11-11: "set up otel logging to
# Cloudflare now that we have workers Paid"): one structured line per answer
# in Workers Logs (the tools it used, steps, time, cost, partial or not, case
# files read, and topic words checked against the City's own budget and
# zoning books), never the question, the answer, an account, an IP or an
# address. The chat page's footer says so. Remove to stop.
TELEMETRY = "true"

# Workers Logs (OpenTelemetry-compatible, kept 7 days; persisted logs count
# toward Cloudflare Observability usage from 2026-12-01). On for console
# output only: Siren's own lines (the telemetry above, and the fixed error
# lines). Invocation logs stay off, because they record each request's URL
# and headers: sign-in and carry-invite tokens, a GET search's words,
# cookies. Traces stay off too: they record outbound request URLs, and a
# block report's Socrata queries carry the address someone looked up.
# https://developers.cloudflare.com/workers/observability/logs/workers-logs/
# (read 2026-11-11).
[env.siren.observability]
enabled = true

[env.siren.observability.logs]
invocation_logs = false
head_sampling_rate = 1

[[env.siren.kv_namespaces]]
binding = "LIMITS"
id = "d4dfe5ca9b814268a1a1abe052287959"

# The SIREN_DB D1 database. Created 2026-11-09 (ENAM) for the first,
# server-side endorsement design; migrations 0001 and 0002 applied the same
# day. Endorsements now live in people's own repos. On 2026-11-11 the old
# tables were checked empty (0 rows in endorsements, endorsement_counts,
# bsky_rate_counts and siren_d1_budget), then 0003 (dropping them), 0004 (the
# free tier's public questions, read with PUBLIC_ASK on) and 0005 (shared
# research's sources) were applied through the D1 query API and recorded in
# d1_migrations, so wrangler counts all five applied. Kept bound for the
# planned public board (D9, default, pending Jason).
# Workers Builds doesn't apply migrations: apply each new one before merging:
#   npx wrangler d1 migrations apply SIREN_DB --env siren --remote
[[env.siren.d1_databases]]
binding = "SIREN_DB"
database_name = "siren"
database_id = "34a56416-65cf-4fe3-949d-8d86469929bf"
migrations_dir = "migrations"

# Bluesky burst limits and circuit breakers (docs/bluesky-endorsements.md,
# "Configuration"). Bindings aren't inherited, so they live under env.siren.
# Namespaces 2611063 and 2611065 (the old per-account and D1 limiters) are
# free again.
[[env.siren.ratelimits]]
name = "BSKY_VISITOR_RL"      # per hashed visitor: handle resolution, endorser lists
namespace_id = "2611061"
simple = { limit = 60, period = 60 }

[[env.siren.ratelimits]]
name = "BSKY_INPUT_RL"        # per account typed into the sign-in form (resolution fallback)
namespace_id = "2611062"
simple = { limit = 3, period = 60 }

[[env.siren.ratelimits]]
name = "BSKY_SITE_RL"         # site-wide breakers on outbound calls: resolution, Constellation, AppView
namespace_id = "2611064"
simple = { limit = 300, period = 60 }
