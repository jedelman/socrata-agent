name = "socrata-agent"
main = "worker/index.js"
compatibility_date = "2026-09-01"

rules = [{ type = "Text", globs = ["**/*.html"], fallthrough = true }]

[vars]
MODEL = "openai/gpt-5.6-luna"
CITIES = "norfolk,seattle,chicago"
PER_IP_DAILY = "20"
DAILY_BUDGET_USD = "2"
MAX_STEPS = "6"
MAX_TOKENS = "1200"
# SUBREQUEST_BUDGET: outbound requests per answer, model calls and retries
# included (default 120, range 10-10000): a guard against a runaway answer.
# Siren's account is on Workers Paid (10,000 external subrequests per
# invocation, since 2026-11-09); on Workers Free (50) set it to 45. Tool
# requests stop short of the budget so the final answer can still be asked
# for. See src/request-budget.js.
# SUBREQUEST_BUDGET = "120"
# WORKING_NOTES: the chat page's live working notes (default on): the model's
# summarized thinking (Claude models) and a line per tool, streamed while the
# answer is worked out, never saved. "off" sends only the JSON answer. See
# worker/ask-stream.js and the README's Deploy section.
# WORKING_NOTES = "off"

# Limits are counted here. Create it once and paste the id:
#   npx wrangler kv namespace create LIMITS
# Without this binding the Worker refuses questions (it fails closed). For
# local `wrangler dev` only, put ALLOW_UNLIMITED=true in .dev.vars.
# [[kv_namespaces]]
# binding = "LIMITS"
# id = "<paste id>"

# Optional: put Cloudflare Access in front and count limits per person.
# Set both, and the Worker refuses any request without a valid Access token:
# ACCESS_TEAM_DOMAIN = "yourteam.cloudflareaccess.com"
# ACCESS_AUD = "<application audience tag from the Access dashboard>"
# PER_USER_DAILY = "40"

# Secrets (never in this file):
#   npx wrangler secret put OPENROUTER_API_KEY
#   npx wrangler secret put IP_SALT            # any random string
#   npx wrangler secret put SOCRATA_APP_TOKEN  # optional

# Siren: the public deployment at https://ask-siren.jason-edelman.org/ (its
# own origin since 2026-11-10; before that, jason-edelman.org/ask-siren).
# Deploys: Workers Builds (the Cloudflare dashboard's Git connection on the
# "siren" Worker) runs `npm ci && npm test`, then `npx wrangler deploy --env
# siren`, on every push to main. Preview builds are off: a preview would share
# this Worker's secrets and KV on a public workers.dev URL.
#   npx wrangler kv namespace create LIMITS --env siren   # paste the id below
#   npx wrangler secret put OPENROUTER_API_KEY --env siren
#   npx wrangler secret put IP_SALT --env siren
#   npx wrangler secret put INVITE_SECRET --env siren   # any long random string
#   npx wrangler secret put ANTHROPIC_API_KEY --env siren   # if MODEL is a claude-* id
#   npx wrangler secret put RESEND_API_KEY --env siren   # email sign-in (resend.com)
#   npx wrangler secret put ADMIN_EMAILS --env siren     # steward emails for <base>/admin, comma-separated
# Email sign-in also needs LOGIN_FROM below, an address on a domain verified
# in Resend. Until both are set, the page offers invite codes only.
#   npx wrangler deploy --env siren
# Pre-alpha: invite-only, with a waitlist. Make codes with
#   node scripts/invites.js create --label "who it's for" --uses 5
# and export the waitlist with `node scripts/invites.js waitlist > ~/siren-waitlist.csv`
# (keep it out of this public repository).
[env.siren]
name = "siren"
account_id = "543fde7feabd0af945bfae926ceea7ad"
# The Custom Domain: the Worker is the origin for the whole hostname, and
# deploying creates its DNS record and certificate (the zone is in this
# account; "You cannot create a Custom Domain on a hostname with an existing
# CNAME DNS record", and ask-siren had no public record on 2026-11-10).
# Adding a Custom Domain or route needs Workers Routes edit on the zone
# (developers.cloudflare.com/workers/authorization/workers/), which the token
# Workers Builds creates by default has, for every zone in the account.
# https://developers.cloudflare.com/workers/configuration/routing/custom-domains/
# (last updated 2026-09-29, read 2026-11-10).
# The old routes stay, so the old address keeps answering, with redirects
# only (MOVED_FROM below, worker/moved.js). Routes run before the root
# site's Custom Domain on jason-edelman.org: "Routes can fetch() Custom
# Domains and take precedence if configured on the same hostname"
# (https://developers.cloudflare.com/workers/configuration/routing/routes/,
# last updated 2026-10-18, read 2026-11-10). So only /ask-siren and
# /ask-siren/* reach this Worker there; the rest of jason-edelman.org is
# untouched. With routes set, workers_dev is inferred false.
routes = [
  { pattern = "ask-siren.jason-edelman.org", custom_domain = true },
  { pattern = "jason-edelman.org/ask-siren", zone_name = "jason-edelman.org" },
  { pattern = "jason-edelman.org/ask-siren/*", zone_name = "jason-edelman.org" },
]

[env.siren.vars]
DEPLOYMENT = "siren"
# Served at the root of its own origin: no path prefix.
BASE_PATH = ""
# The old address: every request to it, over http or https, answers 301 (GET,
# HEAD) or 308 (other methods) to the same path and query here, minus
# /ask-siren. Email sign-ins there end (their cookie was jason-edelman.org's);
# an invite held as a cookie there is carried over (worker/moved.js).
MOVED_FROM = "https://jason-edelman.org/ask-siren"
MODEL = "claude-sonnet-5-5"
PER_IP_DAILY = "20"
DAILY_BUDGET_USD = "2"
MAX_STEPS = "6"
MAX_TOKENS = "1200"
# SUBREQUEST_BUDGET defaults to 120: Siren's account is on Workers Paid
# (2026-11-09). Set it to 45 if the account ever returns to Free (50 a request).
# Working notes are on (the default): uncomment to turn them off.
# WORKING_NOTES = "off"
INVITE_REQUIRED = "true"
PER_INVITE_DAILY = "30"
PER_USER_DAILY = "30"
CONVERSATION_DAYS = "7"
LOGIN_FROM = "Siren <siren@send.jason-edelman.org>"   # verified in Resend (Jason, 2026-11-04)
# Bluesky endorsements (docs/bluesky-endorsements.md, which has the rollout,
# the optional knobs and the reasons): records in each endorser's own repo,
# written from the browser and counted through Constellation. Off until a PR
# adds BLUESKY_LOGIN = "true" here, after the rollout's live probe.
# CONSTELLATION_URL (default https://constellation.microcosm.blue) switches to
# a self-hosted instance; APPVIEW_URL (default https://public.api.bsky.app)
# to another AppView.
# Siren's origin. Sign-in links, annotation ids, the Bluesky client_id and
# every endorsement subject URL are built from it. Subjects are fixed from
# here on: changing it after endorsements exist strands them
# (docs/bluesky-endorsements.md, "The record").
PUBLIC_ORIGIN = "https://ask-siren.jason-edelman.org"

[[env.siren.kv_namespaces]]
binding = "LIMITS"
id = "d4dfe5ca9b814268a1a1abe052287959"

# The SIREN_DB D1 database. Created 2026-11-09 (ENAM) for the first,
# server-side endorsement design; migrations 0001 and 0002 applied the same
# day. Endorsements now live in people's own repos and the Worker never
# touches this database. Migration 0003 drops the old tables and is not
# applied yet (rollout step 5 checks they're empty first). Kept bound for the
# planned public board (D9, default, pending Jason).
# Workers Builds doesn't apply migrations: apply each new one before merging:
#   npx wrangler d1 migrations apply SIREN_DB --env siren --remote
# That command applies every pending migration, so the next one applied also
# applies 0003 and drops the old tables: check they're empty first
# (docs/bluesky-endorsements.md, Rollout, step 5).
[[env.siren.d1_databases]]
binding = "SIREN_DB"
database_name = "siren"
database_id = "34a56416-65cf-4fe3-949d-8d86469929bf"
migrations_dir = "migrations"

# Bluesky burst limits and circuit breakers (docs/bluesky-endorsements.md,
# "Configuration"). Bindings aren't inherited, so they live under env.siren.
# Namespaces 2611063 and 2611065 (the old per-account and D1 limiters) are
# free again.
[[env.siren.ratelimits]]
name = "BSKY_VISITOR_RL"      # per hashed visitor: handle resolution, endorser lists
namespace_id = "2611061"
simple = { limit = 60, period = 60 }

[[env.siren.ratelimits]]
name = "BSKY_INPUT_RL"        # per account typed into the sign-in form (resolution fallback)
namespace_id = "2611062"
simple = { limit = 3, period = 60 }

[[env.siren.ratelimits]]
name = "BSKY_SITE_RL"         # site-wide breakers on outbound calls: resolution, Constellation, AppView
namespace_id = "2611064"
simple = { limit = 300, period = 60 }
