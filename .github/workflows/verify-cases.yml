name: Verify case files
# Re-fetch every case-file source and check each quote is still there. A
# missing quote or a vanished page fails this job; a site that blocks this
# runner only warns until 30 days after its last successful check; fix the finding (or mark
# it unverified) rather than letting Siren serve a quote that's gone.
on:
  schedule:
    - cron: '41 10 * * 3' # Wednesdays 10:41 UTC
  pull_request:
    paths: ['data/cases/**', 'scripts/verify-cases.js']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # pdftotext for PDF sources. Retried: on 2026-11-11 the runner's
      # Ubuntu mirrors failed to resolve for minutes at a time, failing this
      # job before any quote was checked.
      - name: Install poppler-utils (retried)
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y poppler-utils && exit 0
            echo "apt attempt $i failed; retrying in 60 s"; sleep 60
          done
          exit 1
      - run: npm ci
      - run: npm run verify:cases
