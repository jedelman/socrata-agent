name: Archive case-file sources
# Durable findings: make sure a Wayback Machine snapshot holds each case-file
# quote, and record the bytes we read (DASL CID) and the quote's selector.
# This runs on GitHub's runners because Claude Code cloud sessions can't
# reach web.archive.org (connection reset, checked 2026-11-04).
#
# Monthly (and on demand): runs `verify-cases --write --archive` and, if the
# case files changed, opens a pull request for the steward to review. That
# also renews each finding's `checked` date. Needs the repository setting
# "Allow GitHub Actions to create and approve pull requests"; without it the
# branch is still pushed and the step says so.
#
# When the case files changed, it also rebuilds the gap files from them
# offline (docs/gaps.md §5.3 item 7: build-gaps and build-gaps-proposed
# --offline, which rewrite the gap inventory too) and adds data/gaps,
# docs/gaps-norfolk.md, docs/gaps-budget-proposed.md and docs/gaps-inventory.md
# to the same pull request, with scripts/gap-refresh.js's summary in its body,
# so the gap files' finding evidence changes beside its sources. A failed
# rebuild never stops the case-file pull request: the body says so instead.
#
# On pushes to a working branch that touch the verifier, it runs once as a
# read-only probe (no writes, no saves, no PR), to show whether snapshots can be
# looked up and read from GitHub's runners.
on:
  schedule:
    - cron: '17 12 3 * *' # the 3rd of each month, 12:17 UTC
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['scripts/verify-cases.js', '.github/workflows/archive-case-sources.yml']
permissions:
  contents: write
  pull-requests: write
env:
  # Every path a gap rebuild writes (node scripts/gap-refresh.js paths;
  # test/workflows.test.js holds this to it).
  GAP_PATHS: data/gaps docs/gaps-budget-proposed.md docs/gaps-inventory.md docs/gaps-norfolk.md
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci
      - name: Probe (read-only)
        if: github.event_name == 'push'
        run: node scripts/verify-cases.js --archive --no-save
      - name: Snapshot the gap files
        if: github.event_name != 'push'
        run: node scripts/gap-refresh.js snapshot "$RUNNER_TEMP/gaps-before"
      - name: Verify, archive and record
        if: github.event_name != 'push'
        run: |
          set +e
          node scripts/verify-cases.js --write --archive | tee verify.log
          echo "VERIFY_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
      - name: Open a pull request with the new evidence
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- data/cases; then echo "No changes to case files."; exit 0; fi
          # Rebuild the gap files from the new case files. A failure here
          # never stops the case-file pull request.
          set +e
          {
            node scripts/build-gaps.js --offline &&
            node scripts/build-gaps-proposed.js --offline &&
            npm run check:gaps &&
            node scripts/build-gaps-proposed.js --check &&
            node scripts/gap-refresh.js decide --before "$RUNNER_TEMP/gaps-before" \
              --context "Offline rebuild from the case files in this pull request (archive-case-sources.yml, run $GITHUB_RUN_ID)." \
              --summary "$RUNNER_TEMP/gap-refresh.md" --result "$RUNNER_TEMP/gap-refresh.json"
          } > "$RUNNER_TEMP/gaps.log" 2>&1
          gaps_status=$?
          set -e
          cat "$RUNNER_TEMP/gaps.log"
          branch="bot/case-evidence-$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          if [ "$gaps_status" = 0 ]; then
            git add -- data/cases $GAP_PATHS
            git commit -m "Case files: archive snapshots and evidence, $(date -u +%Y-%m-%d)" -m "With the gap files rebuilt offline from them."
          else
            git checkout HEAD -- $GAP_PATHS
            git add data/cases
            git commit -m "Case files: archive snapshots and evidence, $(date -u +%Y-%m-%d)" -m "The gap rebuild failed; the gap files are not in this commit."
            echo "::warning title=Gap rebuild failed::The case-file pull request goes ahead without the gap files; its body says how to rebuild them."
          fi
          git push -u origin "$branch"
          {
            echo "Monthly run of \`scripts/verify-cases.js --write --archive\` (exit ${VERIFY_EXIT})."
            echo
            echo 'It records, for each finding that passed: the date and how it was proven (live or archived), the DASL CID and size of the bytes read, the quote selector, and a Wayback Machine snapshot that holds the quote.'
            echo
            echo 'Review the `??` and `XX` lines below before merging: a `??` means the live page changed or vanished and the finding now stands on an archived copy.'
            echo
            echo '```'
            grep -E '^(  (ok|\?\?|XX|-) |[a-z].*|Wayback|The Wayback|All quotes|[0-9]+ finding)' verify.log | tail -80
            echo '```'
            echo
            if [ "$gaps_status" = 0 ]; then
              echo '**Gap files.** Rebuilt offline from these case files (`build-gaps --offline`, `build-gaps-proposed --offline`, both `--check` runs passing): `data/gaps`, `docs/gaps-norfolk.md`, `docs/gaps-budget-proposed.md` and `docs/gaps-inventory.md` are in this pull request. What changed in them, from `scripts/gap-refresh.js` (it decides `pr` for any change that needs review; everything here is reviewed with this pull request either way):'
              echo
              cat "$RUNNER_TEMP/gap-refresh.md"
            else
              echo '**Gap files: the offline rebuild failed**, so they are not in this pull request, and once it merges they trail these case files (the CI job check-gaps fails) until someone pushes the rebuild to this branch or to main:'
              echo
              echo '```'
              echo 'node scripts/build-gaps.js --offline && node scripts/build-gaps-proposed.js --offline'
              echo 'npm run check:gaps && node scripts/build-gaps-proposed.js --check'
              echo '```'
              echo
              echo "The rebuild's output:"
              echo
              echo '```'
              tail -n 40 "$RUNNER_TEMP/gaps.log"
              echo '```'
            fi
          } > body.md
          gh pr create --base main --head "$branch" --title "Case files: archive snapshots and evidence ($(date -u +%Y-%m-%d))" --body-file body.md \
            || echo "Couldn't open the pull request (is 'Allow GitHub Actions to create and approve pull requests' on?). The branch $branch is pushed."
